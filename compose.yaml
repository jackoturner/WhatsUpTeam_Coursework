services:
  database:
    build:
      context: ./infrastructure/database
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Copy .env.example to .env first}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP
          --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}"
          --execute='SELECT 1' > /dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  phpmyadmin:
    profiles:
      - devtools
    image: phpmyadmin:5.2-apache
    environment:
      PMA_HOST: database
      PMA_PORT: "3306"
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8081}:80"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - admin
      - data
    restart: unless-stopped

  dev-seed:
    profiles:
      - devtools
    image: mysql:8.4
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -eu;
        MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP --host=database
        --user="$$MYSQL_USER" --database="$$MYSQL_DATABASE" < /seed.sql;
        cp /sample-attachment.txt /attachments/00000000000000000000000000000001;
        chmod 644 /attachments/00000000000000000000000000000001
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - ./infrastructure/database/dev/seed.sql:/seed.sql:ro
      - ./infrastructure/database/dev/sample-attachment.txt:/sample-attachment.txt:ro
      - attachments_data:/attachments
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - data
    restart: "no"

  backend:
    build:
      context: ./src/backend
      target: runtime
    environment:
      DB_HOST: database
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      DB_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      ATTACHMENT_STORAGE_PATH: /var/lib/whatsup/attachments
    volumes:
      - attachments_data:/var/lib/whatsup/attachments
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app
      - data
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./src/frontend
      target: runtime
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/healthz]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data:
  attachments_data:

networks:
  app:
  admin:
  data:
    internal: true
